<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" preserveAspectRatio="xMidYMid meet" style="background-color: #0f1115; font-family: sans-serif;">
  <defs>
    <style>
      .node-rect { fill: #252833; stroke: #374151; stroke-width: 2; rx: 8; }
      .node-text { fill: #f0f0f0; font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
      .node-subtext { fill: #9ca3af; font-family: monospace; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
      .edge-path { fill: none; stroke: #374151; stroke-width: 2; }
      .pulse-dot { fill: #76b900; filter: drop-shadow(0 0 4px #76b900); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>

  <!-- Edges -->
  <path id="path-0" d="M 180 175 L 310 175" class="edge-path" marker-end="url(#arrowhead)" />
  <circle r="4" class="pulse-dot">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 180 175 L 310 175" />
  </circle>

  <path id="path-1" d="M 490 175 L 620 175" class="edge-path" marker-end="url(#arrowhead)" />
  <circle r="4" class="pulse-dot">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 490 175 L 620 175" />
  </circle>

  <path id="path-2" d="M 700 205 Q 700 280 400 280 Q 100 280 100 205" class="edge-path" marker-end="url(#arrowhead)" stroke-dasharray="6,6" />
  <circle r="4" class="pulse-dot">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 700 205 Q 700 280 400 280 Q 100 280 100 205" />
  </circle>

  <!-- Nodes -->
  <g transform="translate(100, 175)">
    <rect x="-80" y="-30" width="160" height="60" class="node-rect" />
    <text y="-5" class="node-text">MetricsBundle</text>
    <text y="15" class="node-subtext">(hotspots, simd, cascade)</text>
  </g>

  <g transform="translate(400, 175)">
    <rect x="-90" y="-30" width="180" height="60" class="node-rect" />
    <text y="-5" class="node-text">tuner.py</text>
    <text y="15" class="node-subtext">decide(bundle, policy)</text>
  </g>

  <g transform="translate(700, 175)">
    <rect x="-80" y="-30" width="160" height="60" class="node-rect" />
    <text y="-5" class="node-text">PolicyState</text>
    <text y="15" class="node-subtext">(cascade_draft_k, etc.)</text>
  </g>
</svg>