<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuroswarm Architecture Explainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #0d0d0d;
      --panel-bg: #111111;
      --node-bg: #1a1a1a;
      --accent-green: #76b900;
      --text-main: #ffffff;
      --text-muted: #888888;
      --border-color: #2a2a2a;
      --tab-bg: #1a1a1a;
      --tab-active-bg: #76b900;
      --tab-active-text: #000000;
      --arrow-forward: #76b900;
      --arrow-feedback: #6b7280;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .main-card {
      width: 100%;
      max-width: 900px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .label-row {
      color: var(--accent-green);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .header h2 {
      margin: 0 0 0.5rem 0;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .header .subtitle {
      margin: 0 0 2rem 0;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .tab-btn {
      background-color: var(--tab-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .tab-btn:hover:not(.active) {
      background-color: #2a2a2a;
    }
    .tab-btn.active {
      background-color: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-bg);
    }
    
    .diagram-panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0;
      margin-bottom: 1.5rem;
      position: relative;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .diagram-svg {
      width: 100%;
      height: 100%;
      max-width: 850px;
    }
    
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .btn-primary, .btn-secondary {
      font-family: 'Inter', sans-serif;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }
    .btn-primary {
      background-color: var(--accent-green);
      color: #000;
      border: 1px solid var(--accent-green);
    }
    .btn-primary:hover {
      background-color: #88d400;
    }
    .btn-secondary {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      background-color: #1a1a1a;
    }
    
    .description-block {
      background-color: var(--node-bg);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-green);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .description-block strong {
      color: var(--text-main);
      font-weight: 700;
    }
    .description-block p {
      margin: 0;
      color: #c0c0c0;
      display: inline;
    }
    code {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 0.15rem 0.3rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
      color: #e5e7eb;
    }
    
    .footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      display: flex;
      justify-content: space-between;
    }
    .footer-source {
      font-family: monospace;
      color: #a0a0a0;
    }

    /* SVG Styles */
    .node-rect {
      fill: var(--node-bg);
      stroke: var(--border-color);
      stroke-width: 1.5;
      rx: 8;
    }
    .node-title {
      fill: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
    }
    .node-subtitle {
      fill: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
    }
    .edge-forward {
      fill: none;
      stroke: var(--arrow-forward);
      stroke-width: 2;
    }
    .edge-feedback {
      fill: none;
      stroke: var(--arrow-feedback);
      stroke-width: 2;
      stroke-dasharray: 6, 6;
    }
    .pulse-dot-forward {
      fill: var(--arrow-forward);
    }
    .pulse-dot-feedback {
      fill: var(--arrow-feedback);
    }
    .caption-text {
      fill: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-style: italic;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <div class="main-card">
    <div class="label-row" id="top-label">
      OPTIMUZ &middot; <span id="lbl-pillar-name">AROP</span> &middot; INTERACTIVE EXPLAINER
    </div>
    
    <div class="header">
      <h2 id="main-title">Six pillars. One closed loop.</h2>
      <p class="subtitle">Click through each stage. Every number below is taken from the source code.</p>
    </div>
    
    <div class="tabs" id="tabs-container">
      <!-- Tabs generated by JS -->
    </div>
    
    <div class="diagram-panel">
      <svg class="diagram-svg" id="diagram-svg" viewBox="0 0 850 380" preserveAspectRatio="xMidYMid meet">
        <!-- SVG content generated by JS -->
      </svg>
    </div>
    
    <div class="controls">
      <button class="btn-primary" id="play-pause-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="icon-pause"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        <span id="play-pause-text">Pause</span>
      </button>
      <button class="btn-secondary" id="reset-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        Restart
      </button>
    </div>
    
    <div class="description-block">
      <strong>Stage <span id="stage-num">1</span>.</strong> <p id="desc-text"></p>
    </div>
    
    <div class="footer">
      <div>Source: <span class="footer-source" id="footer-source"></span></div>
      <div>Status: <span id="footer-status"></span></div>
    </div>
  </div>

  <script>
    const pillars = [
      {
        id: "arop",
        num: 1,
        short: "AROP",
        title: "Six pillars. One closed loop.",
        status: "confirmed from code",
        source: "neuroswarm_arm/arop/tuner.py",
        description: "The <strong>AROP</strong> (Autonomous Runtime Optimization Policy) engine actively tunes parameters based on live telemetry. It consumes a <code>MetricsBundle</code> and evaluates rules (R0-R3) to adjust parameters like <code>cascade_draft_k</code> and <code>governor_thinking_cap</code>. The resulting <code>PolicyState</code> is clamped and fed back into the runtime.",
        diagram: {
          nodes: [
            { id: "metrics", label: "MetricsBundle", sub: "hotspots, simd, cascade", x: 120, y: 190, w: 180, h: 64 },
            { id: "tuner", label: "tuner.py", sub: "decide(bundle, policy)", x: 425, y: 190, w: 190, h: 64 },
            { id: "policy", label: "PolicyState", sub: "cascade_draft_k, etc.", x: 730, y: 190, w: 180, h: 64 }
          ],
          edges: [
            { id: "e1", path: "M 210 190 L 330 190", source: "metrics", target: "tuner", type: "forward" },
            { id: "e2", path: "M 520 190 L 640 190", source: "tuner", target: "policy", type: "forward" },
            { id: "e3", path: "M 730 222 Q 730 320 425 320 Q 120 320 120 222", source: "policy", target: "metrics", type: "feedback", caption: "policy update · every N seconds, bypasses inference", capX: 425, capY: 340 }
          ]
        }
      },
      {
        id: "ascr",
        num: 2,
        short: "ASCR",
        title: "Speculative Cascade",
        status: "confirmed from code",
        source: "neuroswarm_arm/runtime/dipa/speculative/engine.py",
        description: "The <strong>ASCR</strong> engine masks tool-call latency using speculative decoding principles. When a <code>ChatRequest</code> arrives, it concurrently triggers the <code>FakePredictor</code> (B2) and the normal cascade. High-confidence predictions dispatch an <code>executor.speculate(pred)</code>. If the LLM generates a matching tool call, the cached output is injected immediately.",
        diagram: {
          nodes: [
            { id: "req", label: "ChatRequest", sub: "User Message", x: 120, y: 190, w: 160, h: 64 },
            { id: "pred", label: "ToolPredictor", sub: "predict(messages)", x: 425, y: 100, w: 180, h: 64 },
            { id: "casc", label: "Cascade", sub: "generate(req)", x: 425, y: 280, w: 180, h: 64 },
            { id: "exec", label: "SpeculativeExecutor", sub: "speculate(pred)", x: 730, y: 190, w: 200, h: 64 }
          ],
          edges: [
            { id: "e1", path: "M 200 190 C 270 190 270 100 335 100", source: "req", target: "pred", type: "forward" },
            { id: "e2", path: "M 200 190 C 270 190 270 280 335 280", source: "req", target: "casc", type: "forward" },
            { id: "e3", path: "M 515 100 C 585 100 585 190 630 190", source: "pred", target: "exec", type: "forward" },
            { id: "e4", path: "M 515 280 C 585 280 585 190 630 190", source: "casc", target: "exec", type: "feedback", caption: "tool output cache hit / miss", capX: 610, capY: 260 }
          ]
        }
      },
      {
        id: "mcp",
        num: 3,
        short: "MCP Router",
        title: "Semantic Routing",
        status: "confirmed from code",
        source: "neuroswarm_arm/tools/semantic_mcp_router.py",
        description: "The <strong>Semantic Tool Router</strong> evaluates a <code>query</code> alongside a <code>RouteContext</code> (tracking <code>memory_pressure</code>, <code>budget_remaining_usd</code>, etc.). It uses a TurboVec ANN index (defaulting to <code>nomic-embed-text-v1.5</code>) to return a <code>RoutingResult</code> of highly relevant <code>ToolDef</code>s, keeping the context window lean.",
        diagram: {
          nodes: [
            { id: "in", label: "Query + Context", sub: "budget, latency_slo", x: 140, y: 190, w: 180, h: 64 },
            { id: "ann", label: "TurboVec ANN", sub: "nomic-embed-text", x: 425, y: 190, w: 180, h: 64 },
            { id: "out", label: "RoutingResult", sub: "[ToolDef, ToolDef]", x: 710, y: 190, w: 180, h: 64 }
          ],
          edges: [
            { id: "e1", path: "M 230 190 L 335 190", source: "in", target: "ann", type: "forward" },
            { id: "e2", path: "M 515 190 L 620 190", source: "ann", target: "out", type: "forward" }
          ]
        }
      },
      {
        id: "maks",
        num: 4,
        short: "MAKS KV",
        title: "CXL-Aware KV Cache",
        status: "confirmed from code",
        source: "neuroswarm_arm/runtime/okf_slot_affinity.py",
        description: "The <strong>MAKS</strong> (Memory-Aware KV Scheduling) system operates via <code>OkfSlotAffinity</code>. It maintains an LRU map tying <code>okf_block_hashes</code> to a specific Llama server <code>id_slot</code>. This affinity routing enables zero-copy KV cache reuse across distributed or CXL-attached memory instances.",
        diagram: {
          nodes: [
            { id: "req", label: "Request Baggage", sub: "okf_block_hashes", x: 140, y: 190, w: 180, h: 64 },
            { id: "aff", label: "OkfSlotAffinity", sub: "lookup(hashes)", x: 425, y: 190, w: 180, h: 64 },
            { id: "slot", label: "LlamaCppBackend", sub: "id_slot = 4", x: 710, y: 190, w: 180, h: 64 }
          ],
          edges: [
            { id: "e1", path: "M 230 190 L 335 190", source: "req", target: "aff", type: "forward" },
            { id: "e2", path: "M 515 190 L 620 190", source: "aff", target: "slot", type: "forward" }
          ]
        }
      },
      {
        id: "rtg",
        num: 5,
        short: "RTG",
        title: "Reasoning-Token Governor",
        status: "confirmed from code",
        source: "neuroswarm_arm/governor.py",
        description: "The <strong>Reasoning-Token Governor</strong> dynamically bounds Chain-of-Thought output. It evaluates a <code>PlanState</code>, incorporating signals like <code>slo_remaining_ms</code> and <code>tool_confidence_top1</code>. It outputs a <code>thinking_token_cap</code> to force the model to commit before exhausting its compute budget.",
        diagram: {
          nodes: [
            { id: "plan", label: "PlanState", sub: "slo, confidence", x: 140, y: 190, w: 180, h: 64 },
            { id: "gov", label: "RTGRuntime", sub: "cap(plan)", x: 425, y: 190, w: 180, h: 64 },
            { id: "out", label: "System Prompt", sub: "thinking_token_cap", x: 710, y: 190, w: 180, h: 64 }
          ],
          edges: [
            { id: "e1", path: "M 230 190 L 335 190", source: "plan", target: "gov", type: "forward" },
            { id: "e2", path: "M 515 190 L 620 190", source: "gov", target: "out", type: "forward" }
          ]
        }
      },
      {
        id: "aqr",
        num: 6,
        short: "AQR",
        title: "Adaptive Quantization",
        status: "confirmed from code",
        source: "neuroswarm_arm/aqr.py",
        description: "The <strong>Adaptive Quantization Router</strong> matches workload profiles to precision formats. Using the <code>pick_quant_primary</code> function, it evaluates the <code>agent_role</code> and <code>workload_class</code> to dynamically route prompts to models running in <code>Q5_K_M</code>, <code>Q4_0</code>, or other quantizations.",
        diagram: {
          nodes: [
            { id: "in", label: "Workload Profile", sub: "agent_role", x: 140, y: 190, w: 180, h: 64 },
            { id: "aqr", label: "AQR Router", sub: "pick_quant()", x: 425, y: 190, w: 180, h: 64 },
            { id: "out", label: "Quant Format", sub: "e.g. Q5_K_M", x: 710, y: 190, w: 180, h: 64 }
          ],
          edges: [
            { id: "e1", path: "M 230 190 L 335 190", source: "in", target: "aqr", type: "forward" },
            { id: "e2", path: "M 515 190 L 620 190", source: "aqr", target: "out", type: "forward" }
          ]
        }
      }
    ];

    let currentPillarId = "arop";
    let isPlaying = true;

    function renderTabs() {
      const container = document.getElementById("tabs-container");
      container.innerHTML = "";
      
      pillars.forEach(p => {
        const btn = document.createElement("button");
        btn.className = `tab-btn ${p.id === currentPillarId ? 'active' : ''}`;
        btn.innerHTML = `${p.num} &middot; ${p.short}`;
        btn.onclick = () => selectPillar(p.id);
        container.appendChild(btn);
      });
    }

    function renderDiagram(pillarId) {
      const pillar = pillars.find(p => p.id === pillarId);
      const svg = document.getElementById("diagram-svg");
      
      let svgHtml = `
        <defs>
          <marker id="arrow-forward" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow-forward)" />
          </marker>
          <marker id="arrow-feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow-feedback)" />
          </marker>
        </defs>
      `;
      
      // Draw edges
      pillar.diagram.edges.forEach((edge, i) => {
        const isForward = edge.type === "forward";
        const edgeClass = isForward ? "edge-forward" : "edge-feedback";
        const marker = isForward ? "url(#arrow-forward)" : "url(#arrow-feedback)";
        const dotClass = isForward ? "pulse-dot-forward" : "pulse-dot-feedback";
        
        svgHtml += `<path id="path-${i}" d="${edge.path}" class="${edgeClass}" marker-end="${marker}" />`;
        
        if (edge.caption && edge.capX && edge.capY) {
            svgHtml += `<text x="${edge.capX}" y="${edge.capY}" class="caption-text">${edge.caption}</text>`;
        }
        
        // Add animated pulse
        svgHtml += `
          <circle r="4" class="${dotClass}">
            <animateMotion dur="3s" repeatCount="indefinite" path="${edge.path}">
              <mpath href="#path-${i}" />
            </animateMotion>
          </circle>
        `;
      });
      
      // Draw nodes
      pillar.diagram.nodes.forEach(node => {
        svgHtml += `
          <g transform="translate(${node.x}, ${node.y})">
            <rect x="${-node.w/2}" y="${-node.h/2}" width="${node.w}" height="${node.h}" class="node-rect" />
            <text y="-8" class="node-title">${node.label}</text>
            <text y="14" class="node-subtitle">${node.sub}</text>
          </g>
        `;
      });
      
      svg.innerHTML = svgHtml;
      
      if (!isPlaying) {
        svg.pauseAnimations();
      }
    }

    function updateContent(pillarId) {
      const pillar = pillars.find(p => p.id === pillarId);
      document.getElementById("lbl-pillar-name").innerText = pillar.short;
      document.getElementById("main-title").innerText = pillar.title;
      document.getElementById("stage-num").innerText = pillar.num;
      document.getElementById("desc-text").innerHTML = pillar.description;
      document.getElementById("footer-source").innerText = pillar.source;
      document.getElementById("footer-status").innerText = pillar.status;
    }

    function selectPillar(id) {
      currentPillarId = id;
      renderTabs();
      renderDiagram(id);
      updateContent(id);
    }

    document.getElementById("play-pause-btn").addEventListener("click", () => {
      isPlaying = !isPlaying;
      const svg = document.getElementById("diagram-svg");
      const text = document.getElementById("play-pause-text");
      const btn = document.getElementById("play-pause-btn");
      
      if (isPlaying) {
        svg.unpauseAnimations();
        text.innerText = "Pause";
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg> <span id="play-pause-text">Pause</span>`;
      } else {
        svg.pauseAnimations();
        text.innerText = "Play";
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> <span id="play-pause-text">Play</span>`;
      }
    });
    
    document.getElementById("reset-btn").addEventListener("click", () => {
      const svg = document.getElementById("diagram-svg");
      svg.setCurrentTime(0);
      if (!isPlaying) {
          document.getElementById("play-pause-btn").click();
      }
    });

    // Initialize
    selectPillar(currentPillarId);
  </script>
</body>
</html>
