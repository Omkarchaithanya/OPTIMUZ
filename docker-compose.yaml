services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.arm64
    image: neuroswarm-arm-gateway:${NSA_IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      NSA_TIER1_URL: http://tier1:8080
      NSA_TIER2_URL: http://tier2:8080
      NSA_TIER3_URL: http://tier3:8080
      NSA_TIER_SPEC_URL: http://tier-spec:8080
      NSA_TOOL_METADATA_ROOT: /app/templates/mcp-servers
      NSA_ROUTER_EMBEDDING_BACKEND: ${NSA_ROUTER_EMBEDDING_BACKEND:-fastembed}
      NSA_ROUTER_ENCODER: ${NSA_ROUTER_ENCODER:-nomic-embed-text-v1.5}
      NSA_ROUTER_FASTEMBED_CACHE: ${NSA_ROUTER_FASTEMBED_CACHE:-/app/.fastembed_cache}
      NSA_ROUTER_TURBOVEC_MIN_TOOLS: ${NSA_ROUTER_TURBOVEC_MIN_TOOLS:-0}
      NSA_ROUTER_HIGH_CONF_GATE: ${NSA_ROUTER_HIGH_CONF_GATE:-0.70}
      NSA_AROP_CANARY_PCT: ${NSA_AROP_CANARY_PCT:-5}
      # default-on for the speculative tool calling demo; the 503-when-OFF behavior is still exposed via the env override
      NSA_MCP_EXECUTE: ${NSA_MCP_EXECUTE:-1}
      NSA_TOOL_SPEC_ENABLED: ${NSA_TOOL_SPEC_ENABLED:-1}
      NSA_TOOL_SPEC_THRESHOLD: ${NSA_TOOL_SPEC_THRESHOLD:-0.75}
      NSA_REQUIRE_KLEIDIAI: ${NSA_REQUIRE_KLEIDIAI:-0}
      NSA_DIPA_KLEIDIAI: ${NSA_DIPA_KLEIDIAI:-1}
      NSA_DIPA_PD_MODE: ${NSA_DIPA_PD_MODE:-off}
      NSA_DIPA_PREFILL_BACKEND: ${NSA_DIPA_PREFILL_BACKEND:-sglang}
      NSA_DIPA_DECODE_BACKEND: ${NSA_DIPA_DECODE_BACKEND:-llama_cpp}
      NSA_DIPA_SGLANG_URL: ${NSA_DIPA_SGLANG_URL:-http://sglang-prefill:30000}
      NSA_DIPA_CHUNK_SIZE: ${NSA_DIPA_CHUNK_SIZE:-2048}
      NSA_DIPA_OTEL: ${NSA_DIPA_OTEL:-1}
      NSA_DIPA_OTEL_ENDPOINT: ${NSA_DIPA_OTEL_ENDPOINT:-http://otel-collector:4318/v1/traces}
      NSA_RMF_EXPORTERS: ${NSA_RMF_EXPORTERS:-prometheus,otlp}
      NSA_RMF_OTLP_ENDPOINT: ${NSA_RMF_OTLP_ENDPOINT:-http://otel-collector:4317}
      NSA_RMF_OTLP_INSECURE: ${NSA_RMF_OTLP_INSECURE:-1}
      NSA_RMF_PERFORMIX: ${NSA_RMF_PERFORMIX:-1}
      NSA_RMF_PERFORMIX_PATH: ${NSA_RMF_PERFORMIX_PATH:-work/performix/snapshot.json}
      # ROF uses OTLP *HTTP* span exporter — must hit :4318/v1/traces (not gRPC :4317).
      NSA_ROF_OTLP_ENDPOINT: ${NSA_ROF_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      NSA_ROF_OTLP_INSECURE: ${NSA_ROF_OTLP_INSECURE:-1}
      NSA_ROF_EXPORTERS: ${NSA_ROF_EXPORTERS:-otlp,prometheus}
      NSA_AROP_PERFORMIX: ${NSA_AROP_PERFORMIX:-1}
      NSA_AROP_PERFORMIX_MCP: ${NSA_AROP_PERFORMIX_MCP:-}
      NSA_AROP_PERFORMIX_BIN: ${NSA_AROP_PERFORMIX_BIN:-apx}
      NSA_AROP_REFLECTION: ${NSA_AROP_REFLECTION:-hybrid}
      NSA_AROP_GEPA_LM: ${NSA_AROP_GEPA_LM:-mock}
      NSA_AROP_GEPA_LM_MODEL: ${NSA_AROP_GEPA_LM_MODEL:-default}
      NSA_MEM_PROVIDER: ${NSA_MEM_PROVIDER:-mem0}
      NSA_MEM_STORE: ${NSA_MEM_STORE:-/app/work/memory}
      NSA_MEM_QDRANT_PATH: ${NSA_MEM_QDRANT_PATH:-/app/work/memory/qdrant}
      NSA_MEM_QDRANT_URL: ${NSA_MEM_QDRANT_URL:-http://qdrant:6333}
      NSA_MEM_LLM: ${NSA_MEM_LLM:-none}
      NSA_MEM_LLM_BASE_URL: ${NSA_MEM_LLM_BASE_URL:-http://tier2:8080}
      NSA_MEM_EMBEDDER: ${NSA_MEM_EMBEDDER:-hash}
      NSA_ASCR_TEXT_AGREE: ${NSA_ASCR_TEXT_AGREE:-1}
      NSA_LLAMA_N_PROBS: ${NSA_LLAMA_N_PROBS:-0}
      # Container path; host bind source uses NSA_LLAMA_SLOT_DIR from .env
      NSA_LLAMA_SLOT_DIR: /var/lib/ns/slots
      NSA_LLAMA_SLOT_KV_REUSE: ${NSA_LLAMA_SLOT_KV_REUSE:-1}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "performix-bridge:host-gateway"
    volumes:
      - ./work:/app/work
      - ./neuroswarm_arm:/app/neuroswarm_arm:ro
      - ./okf:/app/okf
      - ./templates:/app/templates:ro
      - ${MODEL_DIR:-/models}:/models:ro
      - ${NSA_LLAMA_SLOT_DIR:-/tmp/neuroswarm-slots}:/var/lib/ns/slots
    depends_on:
      tier1:
        condition: service_started
      tier2:
        condition: service_started
      tier3:
        condition: service_started
      tier-spec:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 6
    # Plain docker compose honors mem_limit/cpus; deploy kept for swarm/--compatibility.
    cpus: 1.5
    mem_limit: 3072m
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3072M

  tier1:
    build:
      context: .
      dockerfile: docker/Dockerfile.llama-kleidiai
    image: ${NSA_LLAMA_IMAGE:-nexus-arm/llama-kleidiai:server}
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "8081:8080"
    # Axion c4a-standard-8 (1 NUMA): cache-aware pin — draft on cores 0-1
    cpuset: "${NSA_TIER1_CPUSET:-0-1}"
    environment:
      # Unset = auto SME detect; set 0 to disable on Axion without SME
      GGML_KLEIDIAI_SME: ${GGML_KLEIDIAI_SME:-}
      OMP_NUM_THREADS: "${TIER1_THREADS:-2}"
      OMP_PROC_BIND: ${OMP_PROC_BIND:-close}
      OMP_PLACES: ${OMP_PLACES:-cores}
    command:
      - -m
      - /models/xLAM-2-1B-fc-r-Q4_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "0"
      - -t
      - "${TIER1_THREADS:-2}"
      - -c
      - "${TIER1_CTX:-4096}"
      - --parallel
      - "${TIER1_PARALLEL:-4}"
      - --slots
      - --cache-reuse
      - "64"
      - --slot-save-path
      - /var/lib/ns/slots
      - --metrics
    volumes:
      - ${MODEL_DIR:-/models}:/models:ro
      - ${NSA_LLAMA_SLOT_DIR:-/tmp/neuroswarm-slots}:/var/lib/ns/slots
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || curl -fsS http://127.0.0.1:8080/v1/models >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 12
    cpus: 2.0
    mem_limit: 2g
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  tier-spec:
    build:
      context: .
      dockerfile: docker/Dockerfile.llama-kleidiai
    image: ${NSA_LLAMA_IMAGE:-nexus-arm/llama-kleidiai:server}
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "8084:8080"
    # Target+draft on verifier mid-tier cores (3B needs room; avoid clash with host :8082).
    cpuset: "${NSA_TIER2_CPUSET:-2-4}"
    depends_on: []
    environment:
      GGML_KLEIDIAI_SME: ${GGML_KLEIDIAI_SME:-}
      OMP_NUM_THREADS: "8"
      OMP_PROC_BIND: ${OMP_PROC_BIND:-close}
      OMP_PLACES: ${OMP_PLACES:-cores}
    # Native draft-simple: target=tier2 3B, draft=tier1 0.5B.
    # Flag map: --draft-max → --spec-draft-n-max; --draft-cfg-scale removed upstream.
    command:
      - --model
      - /models/xLAM-2-3B-fc-r-Q4_0.gguf
      - --model-draft
      - /models/xLAM-2-1B-fc-r-Q4_0.gguf
      - --spec-type
      - draft-simple
      - --spec-draft-n-max
      - "32"
      - --draft-p-min
      - "0.5"
      - --port
      - "8080"
      - --host
      - 0.0.0.0
      - -ngl
      - "0"
      - --threads
      - "8"
      - --ctx-size
      - "4096"
      - --cont-batching
      - --parallel
      - "4"
      - --slot-save-path
      - /var/lib/ns/slots
      - --metrics
    volumes:
      - ${MODEL_DIR:-/models}:/models:ro
      - ${NSA_LLAMA_SLOT_DIR:-/tmp/neuroswarm-slots}:/var/lib/ns/slots
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || curl -fsS http://127.0.0.1:8080/v1/models >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 12
    cpus: 3.0
    mem_limit: 6g
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6G

  tier2:
    build:
      context: .
      dockerfile: docker/Dockerfile.llama-kleidiai
    image: ${NSA_LLAMA_IMAGE:-nexus-arm/llama-kleidiai:server}
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "8082:8080"
    # Verifier mid-tier on cores 2-4 (single-UMA locality; not NUMA1)
    cpuset: "${NSA_TIER2_CPUSET:-2-4}"
    environment:
      GGML_KLEIDIAI_SME: ${GGML_KLEIDIAI_SME:-}
      OMP_NUM_THREADS: "${TIER2_THREADS:-3}"
      OMP_PROC_BIND: ${OMP_PROC_BIND:-close}
      OMP_PLACES: ${OMP_PLACES:-cores}
    command:
      - -m
      - /models/xLAM-2-3B-fc-r-Q4_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "0"
      - -t
      - "${TIER2_THREADS:-3}"
      - -c
      - "${TIER2_CTX:-4096}"
      - --parallel
      - "${TIER2_PARALLEL:-4}"
      - --slots
      - --cache-reuse
      - "64"
      - --slot-save-path
      - /var/lib/ns/slots
      - --metrics
    volumes:
      - ${MODEL_DIR:-/models}:/models:ro
      - ${NSA_LLAMA_SLOT_DIR:-/tmp/neuroswarm-slots}:/var/lib/ns/slots
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || curl -fsS http://127.0.0.1:8080/v1/models >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 12
    cpus: 3.0
    mem_limit: 6g
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6G

  tier3:
    build:
      context: .
      dockerfile: docker/Dockerfile.llama-kleidiai
    image: ${NSA_LLAMA_IMAGE:-nexus-arm/llama-kleidiai:server}
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "8083:8080"
    # Verifier large-tier on cores 5-7 (disjoint from draft; single-UMA)
    cpuset: "${NSA_TIER3_CPUSET:-5-7}"
    environment:
      GGML_KLEIDIAI_SME: ${GGML_KLEIDIAI_SME:-}
      OMP_NUM_THREADS: "${TIER3_THREADS:-3}"
      OMP_PROC_BIND: ${OMP_PROC_BIND:-close}
      OMP_PLACES: ${OMP_PLACES:-cores}
    command:
      - -m
      - /models/${TIER3_MODEL:-DeepSeek-R1-Distill-Qwen-7B-Q4_0.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "0"
      - -t
      - "${TIER3_THREADS:-3}"
      - -c
      - "${TIER3_CTX:-4096}"
      - -b
      - "512"
      - --threads-batch
      - "${TIER3_THREADS:-3}"
      - --cont-batching
      - --parallel
      - "${TIER3_PARALLEL:-4}"
      - --mlock
      - --slots
      - --cache-reuse
      - "64"
      - --reasoning
      - "off"
      - --reasoning-budget
      - "0"
      - --slots
      - --cache-prompt
      - --slot-save-path
      - /var/lib/ns/slots
      - --metrics
    volumes:
      - ${MODEL_DIR:-/models}:/models:ro
      - ${NSA_LLAMA_SLOT_DIR:-/tmp/neuroswarm-slots}:/var/lib/ns/slots
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || curl -fsS http://127.0.0.1:8080/v1/models >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 12
    cpus: 3.0
    mem_limit: 14g
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 14G

  sglang-prefill:
    profiles: ["pd"]
    # Multi-arch; verify arm64 + Arm Neoverse CPU engine before demo claims.
    # https://developer.arm.com/community/arm-community-blogs/b/ai-blog/posts/bringing-sglang-high-performance-llm-inference-to-arm-neoverse
    image: ${NSA_SGLANG_IMAGE:-lmsysorg/sglang:latest}
    platform: linux/arm64
    restart: unless-stopped
    environment:
      SGLANG_USE_CPU_ENGINE: "1"
    command:
      - python
      - -m
      - sglang.launch_server
      - --model-path
      - ${NSA_SGLANG_MODEL:-meta-llama/Llama-3.2-1B-Instruct}
      - --device
      - cpu
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --mem-fraction-static
      - "0.7"
      - --chunked-prefill-size
      - "${NSA_DIPA_CHUNK_SIZE:-2048}"
    ports:
      - "30000:30000"
    volumes:
      - ${MODEL_DIR:-/models}:/models:ro
      - ${HF_HOME:-./work/hf}:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30000/health >/dev/null || curl -fsS http://127.0.0.1:30000/v1/models >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
    cpus: 2.0
    mem_limit: 8g
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    platform: linux/arm64
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # Dual-host: neuroswarm-obs Prometheus (not container loopback). Override in .env when obs VM exists.
      OBS_PROMETHEUS_REMOTE_WRITE: ${OBS_PROMETHEUS_REMOTE_WRITE:-http://127.0.0.1:9090/prometheus/api/v1/write}
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./ops/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      gateway:
        condition: service_started
    # Distroless image has no /bin/sh — CMD-SHELL healthchecks always fail.
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    cpus: 0.5
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.55.1
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 6
    cpus: 0.5
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  grafana:
    image: grafana/grafana:11.4.0
    platform: linux/arm64
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-neuroswarm}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 12
    cpus: 0.5
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # Mem0 vector store — server mode avoids embedded Qdrant single-writer locks.
  qdrant:
    image: qdrant/qdrant:v1.13.6
    platform: linux/arm64
    restart: unless-stopped
    volumes:
      - ./work/memory/qdrant-server:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    cpus: 0.5
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  arm-mcp:
    image: armlimited/arm-mcp:latest
    platform: linux/arm64
    restart: unless-stopped
    profiles: ["performix"]
    stdin_open: true
    tty: true
    volumes:
      - ./:/workspace
      - ${ARM_MCP_SSH_KEY:-./work/keys/ssh-key.pem}:/run/keys/ssh-key.pem:ro
      - ${ARM_MCP_KNOWN_HOSTS:-./work/keys/known_hosts}:/run/keys/known_hosts:ro
    environment:
      ARM_PERFORMIX_TARGET: ${ARM_PERFORMIX_TARGET:-}
    cpus: 0.5
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # Live Axion Performix path: HTTP JSON-RPC /mcp wrapping host apx (not Arm MCP stdio).
  performix-bridge:
    build:
      context: .
      dockerfile: Dockerfile.arm64
    image: neuroswarm-arm-gateway:${NSA_IMAGE_TAG:-dev}
    platform: linux/arm64
    restart: unless-stopped
    profiles: ["performix"]
    network_mode: host
    pid: host
    privileged: true
    working_dir: /app
    command: ["python", "-m", "neuroswarm_arm.evolution.performix_bridge"]
    volumes:
      - ./work:/app/work
      - ./neuroswarm_arm:/app/neuroswarm_arm:ro
      - /usr/local/bin/apx:/usr/local/bin/apx:ro
      - /opt/Arm Performix:/opt/Arm Performix:ro
    environment:
      NSA_AROP_PERFORMIX_BIN: ${NSA_AROP_PERFORMIX_BIN:-apx}
      NSA_PERFORMIX_NSENTER: "1"
      NSA_RMF_PERFORMIX_PATH: ${NSA_RMF_PERFORMIX_PATH:-work/performix/snapshot.json}
      NSA_PERFORMIX_BRIDGE_HOST: "0.0.0.0"
      NSA_PERFORMIX_BRIDGE_PORT: "8090"
      ARM_PERFORMIX_TARGET: ${ARM_PERFORMIX_TARGET:-}
      PATH: /usr/local/bin:/usr/bin:/bin
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:1.27-alpine
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./ops/nginx/neuroswarm.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 8
    cpus: 0.25
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Host OS / container monitors (opt-in). Real /proc + docker.sock — not demo data.
  # Bring-up: docker compose --profile hostmon up -d cadvisor glances glances-web
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    platform: linux/arm64
    profiles: ["hostmon"]
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      # Host Docker requires API >= 1.44; older cAdvisor clients fail with empty dockerVersion.
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --docker=unix:///var/run/docker.sock
      - --store_container_labels=true
      - --disable_metrics=advtcp,cpuset,hugetlb,memory_numa,referenced_memory,resctrl,sched,tcp,udp
    # Reachable from neuroswarm-obs via Axion internal IP (10.128.0.2). Restrict with VPC firewall.
    ports:
      - "8088:8080"
    cpus: 0.5
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # Prometheus exporter only (Glances refuses --export while in -w web mode).
  glances:
    image: nicolargo/glances:latest-full
    platform: linux/arm64
    profiles: ["hostmon"]
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      - ./ops/glances/glances.conf:/glances/conf/glances.conf:ro
    environment:
      GLANCES_OPT: "-q -C /glances/conf/glances.conf --disable-plugin raid,folders,sensors,wifi,irq --export prometheus --time 2"
    ports:
      - "61209:9091"
    cpus: 0.25
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Browser TUI (btop-style). Separate from exporter — see glances service.
  glances-web:
    image: nicolargo/glances:latest-full
    platform: linux/arm64
    profiles: ["hostmon"]
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    environment:
      GLANCES_OPT: "-w --disable-plugin raid,folders,sensors,wifi,irq --time 2"
    ports:
      - "61208:61208"
    cpus: 0.25
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  grafana-data:
