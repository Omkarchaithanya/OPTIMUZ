defaults:
  draft_len: 16
  accept_threshold: 0.78
  proposal_strategy: draft_model
  verify_strategy: block
  graph: default_linear

escalation_graphs:
  default_linear:
    nodes:
      start: {kind: start, tier_id: 1}
      tier1: {kind: tier, tier_id: 1}
      tier2: {kind: tier, tier_id: 2}
      tier3: {kind: tier, tier_id: 3}
      accept: {kind: accept}
    edges:
      - {from: start, to: tier1, condition: always}
      - {from: tier1, to: tier2, condition: low_confidence}
      - {from: tier1, to: accept, condition: accept}
      - {from: tier2, to: tier3, condition: low_confidence}
      - {from: tier2, to: accept, condition: accept}
      - {from: tier3, to: accept, condition: always}

strategies:
  self_speculation:
    enabled: true
    ngram_size: 24
    draft_min: 12
    draft_max: 48
  logits:
    tau_floor: 0.30

confidence:
  weights:
    text_agreement: 0.4
    entropy: 0.3
    quality_score: 0.3
