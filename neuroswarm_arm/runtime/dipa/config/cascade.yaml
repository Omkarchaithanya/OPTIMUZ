tiers:
  - id: 1
    backend: tier1
    model: tier1
    acceptance_threshold: 0.85
  - id: 2
    backend: tier2
    model: tier2
    acceptance_threshold: 0.5
  - id: 3
    backend: tier3
    model: tier3
    acceptance_threshold: 0.0

speculation:
  enabled: true
  self_speculation: true
  ngram_size: 24
  draft_min: 12
  draft_max: 48

confidence:
  uncertainty_phrases:
    - "i don't know"
    - "cannot determine"
    - "insufficient information"

fallback:
  on_all_tiers_fail: degraded
  degraded_message: "Inference temporarily degraded."

escalation_graphs:
  default_linear:
    nodes:
      start:
        kind: start
        tier_id: 1
      tier1:
        kind: tier
        tier_id: 1
      tier2:
        kind: tier
        tier_id: 2
      tier3:
        kind: tier
        tier_id: 3
      accept:
        kind: accept
    edges:
      - from: start
        to: tier1
        condition: always
      - from: tier1
        to: tier2
        condition: low_confidence
      - from: tier1
        to: accept
        condition: accept
      - from: tier2
        to: tier3
        condition: low_confidence
      - from: tier2
        to: accept
        condition: accept
      - from: tier3
        to: accept
        condition: always
